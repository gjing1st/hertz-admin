version: '3'
services:
  backend:
    image: admin-backend:v1.0.0
    container_name: admin-backend
    restart: unless-stopped
    privileged: true
    ports:
      - "9680:9680"
    volumes:
      - ./configs:/bin/config
      - /etc/localtime:/etc/localtime
    networks:
      - adminnet
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
  frontend:
    image: admin-frontend:v1.0.0
    container_name: admin-frontend
    restart: unless-stopped
    volumes:
      - /home/app/admin/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "9633:80"
    depends_on:
      - backend
    networks:
      - adminnet
    privileged: true
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
networks:
  adminnet:
    driver:
      bridge
